name: Deploy Godot Web to Pages
on:
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout development (sandbox)
        id: checkout_dev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: development
          path: development

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Export prod (site root)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          godot --headless --path main --export-release "Web" "$GITHUB_WORKSPACE/site/index.html"

      - name: Export sandbox (/development/)
        if: steps.checkout_dev.outcome == 'success'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site/development"
          godot --headless --path development --export-release "Web" "$GITHUB_WORKSPACE/site/development/index.html"

      - name: Sandbox placeholder when development branch is missing
        if: steps.checkout_dev.outcome != 'success'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site/development"
          printf '%s\n' '<!doctype html><meta charset=utf-8><title>Sandbox</title><p>Push a <code>development</code> branch to publish the sandbox here.</p>' > "$GITHUB_WORKSPACE/site/development/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
