notes = "Stage 1 tileset atlas, 16px tiles, 21 columns x 15 rows, index = row*21 + col (see tile_names and docs/DESIGN.md). Rows 0-1: single tiles 0-23. Rows 2-14: the stair block (stair_block = [col, row, w, h]) drawn in assembly order for a stair rising one floor (160px) to the right; pieces are [col, row, w, h]: landing_bottom 3x3 (flat, ends at the lower floor surface), stair_stamp 15x10 diagonal (240px run, 40 steps of 6px/4px, ~34 deg, matches boy_climb_stairs), stair_rail_cap 3x2 (banister above the stamp top-right), landing_top 3x3 (flat, ends at the upper floor surface). Full stair = 21 tiles (336px). Block row 3 (atlas row 5) is the upper slab row; Stair.bottom = (stamp left edge, lower surface), Stair.top = (stamp right edge, upper surface). Flip_h every tile and mirror columns for stairs rising left. stair_gallery_rail 6x3 (tile_names gallery_rail_r*_c*, block cols 9-14 rows 0-2) is the level gallery balustrade over the upper-floor opening, with a newel post at its left (x+9) end. Its handrail and balusters continue through the stair_rail_cap cells (block cols 15-17, where the sloped banister tucks under it) into the landing rail, so the visible rail spans stair tiles x+9..x+17. Collision hint (PD: solid for the boy and walkers, floaters pass through): stair rising right, solid x = [144, 288) px from the stair origin (left edge of tile x), y = [upper surface - 28, upper surface); the newel finial reaches upper surface - 40 at x 144-149. Stair rising left (columns mirrored c -> x+20-c, i.e. tiles x+3..x+11): solid x = [48, 192) px, newel at x 186-191"

